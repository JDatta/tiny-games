<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Number Garden curriculum checks</title>
</head>
<body data-status="running">
  <h1>Number Garden curriculum checks</h1>
  <pre id="results">Running…</pre>
  <script>
    "use strict";

    const results = document.querySelector("#results");
    const checks = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      checks.push("PASS: " + message);
    }

    function sequence(...values) {
      return () => values.length ? values.shift() : 0;
    }

    function promptMatches(api, key, text, values = {}) {
      return api.PROMPT_POOLS[key].some(template => api.formatPrompt(template, values) === text);
    }

    function waitFor(predicate, message, timeout = 5000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        function check() {
          if (predicate()) return resolve();
          if (performance.now() - started >= timeout) return reject(new Error("Timed out: " + message));
          setTimeout(check, 20);
        }
        check();
      });
    }

    function clearDatabase() {
      return new Promise(resolve => {
        const request = indexedDB.deleteDatabase("numberGarden");
        request.onsuccess = request.onerror = request.onblocked = () => resolve();
      });
    }

    function profileCookie() {
      const part = document.cookie.split(";").map(item => item.trim()).find(item => item.startsWith("numberGardenProgress="));
      return part ? JSON.parse(decodeURIComponent(part.slice("numberGardenProgress=".length))) : null;
    }

    function openGame(query = "") {
      const old = document.querySelector("iframe");
      if (old) old.remove();
      const frame = document.createElement("iframe");
      frame.title = "Game under test";
      frame.src = "../index.html" + query;
      document.body.append(frame);
      return waitFor(() => frame.contentWindow.NumberGarden && frame.contentDocument.querySelector(".row-label"), "game initialization")
        .then(() => frame);
    }

    function enterAnswer(frame, answer, includeWrongAttempt = false) {
      const doc = frame.contentDocument;
      doc.querySelector("#answerButton").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      return waitFor(() => doc.querySelector("#keypadDialog").open, "keypad open").then(() => {
        if (includeWrongAttempt) {
          doc.querySelector('[data-key="0"]').click();
          doc.querySelector("#checkAnswer").click();
        }
        String(answer).split("").forEach(digit => doc.querySelector('[data-key="' + digit + '"]').click());
        doc.querySelector("#checkAnswer").click();
        return waitFor(() => doc.querySelector("#answerButton").textContent === String(answer), "manual completion");
      });
    }

    async function countNextUnits(frame, count) {
      const doc = frame.contentDocument;
      const diagnostics = frame.contentWindow.NumberGarden.motionDiagnostics;
      for (let index = 0; index < count; index += 1) {
        await waitFor(() => doc.querySelector(".unit.eligible"), "eligible unit " + (index + 1));
        const unit = doc.querySelector(".unit.eligible");
        const place = unit.dataset.place;
        const before = diagnostics.snapshot();
        const landedBefore = place === "ones" ? before.onesLandedCursor : before.tensLandedCursor;
        unit.click();
        await waitFor(() => {
          const snapshot = diagnostics.snapshot();
          return (place === "ones" ? snapshot.onesLandedCursor : snapshot.tensLandedCursor) > landedBefore;
        }, "landed unit " + (index + 1));
      }
    }

    async function run() {
      document.cookie = "numberGardenProgress=; Max-Age=0; Path=/; SameSite=Lax";
      await clearDatabase();
      let frame = await openGame("?harness=1");
      const api = frame.contentWindow.NumberGarden;

      assert(api.LEVEL_DEFINITIONS.length === 9, "nine level definitions are exposed");
      assert(api.constants.PROFILE_SCHEMA_VERSION === 2, "profile schema v2 is exposed");
      assert(Object.isFrozen(api.MOTION_TIMINGS) && api.MOTION_TIMINGS.BLOCK_FALL_LAND === 520 &&
        api.MOTION_TIMINGS.CARRY_FORMATION === 300 && api.MOTION_TIMINGS.CARRY_TRAVEL === 560 &&
        api.MOTION_TIMINGS.CARRY_LANDING === 140 && api.MOTION_TIMINGS.BEETLE_REACTION === 360 &&
        api.MOTION_TIMINGS.DICE_TUMBLE === 380 && api.MOTION_TIMINGS.DICE_CARD_POP === 150 &&
        api.MOTION_TIMINGS.DICE_CARD_STAGGER === 35 && api.MOTION_TIMINGS.DICE_REDUCED_HIGHLIGHT === 140 &&
        api.MOTION_TIMINGS.SOLVER_GAP === 70, "production teaching-motion timings are frozen and exposed");
      assert(Object.isFrozen(api.ACTIVE_MOTION_TIMINGS) && api.ACTIVE_MOTION_TIMINGS.BLOCK_FALL_LAND < api.MOTION_TIMINGS.BLOCK_FALL_LAND,
        "harness mode compresses durations without skipping the lifecycle");
      const diceDoc = frame.contentDocument;
      const diceMotion = api.motionDiagnostics;
      diceMotion.clearEvents();
      const stableCurrentCard = diceDoc.querySelector(".suggestion.current");
      const stableCurrentMarkup = stableCurrentCard.innerHTML;
      const rollingDice = diceDoc.querySelector(".dice");
      const diceSoundBaseline = diceMotion.snapshot().soundEffectCount;
      rollingDice.focus();
      rollingDice.click();
      rollingDice.click();
      let diceSnapshot = diceMotion.snapshot();
      assert(diceSnapshot.diceRefreshState === "tumbling" && diceSnapshot.controlsLocked &&
        diceDoc.querySelector("#suggestionTray").getAttribute("aria-busy") === "true" &&
        rollingDice.classList.contains("rolling") && rollingDice.getAttribute("aria-disabled") === "true" &&
        rollingDice.getAttribute("aria-label").includes("Rolling the die"),
        "dice refresh enters a busy rolling state with an accessible in-progress label");
      assert(diceDoc.querySelector("#resetCurrent").disabled && diceDoc.querySelector("#answerButton").disabled &&
        diceDoc.querySelector("#settingsButton").disabled && diceDoc.querySelector("#nextButton").disabled &&
        diceDoc.querySelector(".unit.eligible").disabled &&
        Array.from(diceDoc.querySelectorAll(".suggestion:not(.current)")).every(button => button.disabled),
        "dice refresh locks counting and every competing problem control");
      assert(diceDoc.querySelector(".suggestion.current") === stableCurrentCard && stableCurrentCard.innerHTML === stableCurrentMarkup,
        "the current-problem card stays mounted and unchanged while the die tumbles");
      await waitFor(() => diceMotion.snapshot().diceRefreshState === "emphasizing", "staggered dice alternatives");
      const poppingAlternatives = Array.from(diceDoc.querySelectorAll(".suggestion:not(.current)"));
      assert(poppingAlternatives.length === 3 && poppingAlternatives.every(button =>
        button.classList.contains("refresh-pop") && button.dataset.refreshEmphasis === "pop" &&
        getComputedStyle(button).animationName === "suggestion-refresh-pop"),
        "all three refreshed alternatives receive the staggered pop and colored glow treatment");
      assert(diceDoc.querySelector(".suggestion.current") === stableCurrentCard &&
        !stableCurrentCard.classList.contains("refresh-pop") && !stableCurrentCard.dataset.refreshEmphasis,
        "the current card receives no refreshed-card emphasis");
      await waitFor(() => diceMotion.snapshot().diceRefreshState === "idle", "dice refresh completion");
      diceSnapshot = diceMotion.snapshot();
      const diceEvents = diceMotion.events();
      assert(diceSnapshot.diceRefreshCount === 1 &&
        diceEvents.filter(event => event.type === "dice-refresh-start").length === 1 &&
        diceEvents.some(event => event.type === "dice-tumble-start") &&
        diceEvents.some(event => event.type === "dice-landed") &&
        diceEvents.filter(event => event.type === "dice-card-emphasis").length === 3 &&
        diceEvents.some(event => event.type === "dice-refresh-complete"),
        "rapid repeat activation is ignored and the complete dice-refresh lifecycle is diagnosed");
      assert(diceDoc.activeElement === rollingDice && !diceDoc.querySelector("#suggestionTray").hasAttribute("aria-busy") &&
        !rollingDice.hasAttribute("aria-disabled") && rollingDice.getAttribute("aria-label") === "Refresh the three alternative sums" &&
        !diceSnapshot.controlsLocked && !diceDoc.querySelector("#settingsButton").disabled && !diceDoc.querySelector(".unit.eligible").disabled,
        "completion restores dice focus, accessible labels, and competing controls");
      assert(diceSnapshot.soundEffectCount > diceSoundBaseline,
        "a sound-on dice roll produces the synthesized rattle and landing effect");

      diceDoc.querySelector("#settingsButton").click();
      diceDoc.querySelector("#settingsSoundButton").click();
      diceDoc.querySelector("#closeSettings").click();
      const silentDiceMotion = frame.contentWindow.NumberGarden.motionDiagnostics;
      const silentDiceBaseline = silentDiceMotion.snapshot().soundEffectCount;
      diceDoc.querySelector(".dice").click();
      await waitFor(() => silentDiceMotion.snapshot().diceRefreshState === "idle", "silent dice refresh");
      assert(silentDiceMotion.snapshot().soundEffectCount === silentDiceBaseline,
        "a sound-off dice roll remains silent");
      diceDoc.querySelector("#settingsButton").click();
      diceDoc.querySelector("#settingsSoundButton").click();
      diceDoc.querySelector("#closeSettings").click();
      assert(api.nextQueueBoundary(0, 18, true, false) === 10 && api.nextQueueBoundary(10, 18, true, true) === 18 &&
        api.canQueuePlaceUnit(9, 0, 18, true, false) && !api.canQueuePlaceUnit(10, 0, 18, true, false),
        "queue-boundary helpers close at an unfinished trade and reopen afterward");
      const promptKeys = [
        "counting-ones", "counting-tens", "counting-tens-with-carry", "skip-zero-ones", "carrying-ones",
        "carrying-hundreds", "awaiting-answer", "completed", "place-value-fallback"
      ];
      assert(JSON.stringify(Object.keys(api.PROMPT_POOLS).sort()) === JSON.stringify(promptKeys.slice().sort()),
        "all nine beetle prompt pools are exposed");
      promptKeys.forEach(key => {
        const pool = api.PROMPT_POOLS[key];
        assert(Object.isFrozen(pool) && pool.length === 24, key + " has 24 frozen prompt variants");
        assert(new Set(pool).size === pool.length && pool.every(message => typeof message === "string" && message.trim() === message && message.length > 0),
          key + " contains unique non-empty prompt text");
        assert(pool.every(message => message.length <= 90), key + " prompts stay compact for the mobile layout");
        assert(pool.every(message => Array.from(message.matchAll(/\{([^}]+)\}/g), match => match[1]).every(token => ["a", "b", "result"].includes(token))),
          key + " uses only supported prompt placeholders");
      });
      assert(Object.isFrozen(api.PROMPT_POOLS), "the beetle prompt pool collection is frozen");
      assert(api.PROMPT_POOLS.completed.every(message => message.includes("{a}") && message.includes("{b}") && message.includes("{result}")),
        "every completion prompt includes the full equation");
      assert(promptKeys.filter(key => key !== "completed").every(key => api.PROMPT_POOLS[key].every(message => !message.includes("{"))),
        "only completion prompts contain dynamic placeholders");
      assert(api.selectPromptTemplate(["first", "second"], "first", sequence(0)) === "second",
        "prompt selection avoids the immediately previous template");
      assert(api.selectPromptTemplate(["only"], "only", sequence(.8)) === "only",
        "single-entry prompt selection remains safe");
      assert(api.formatPrompt("Nice! {a} + {b} = {result}.", { a: 68, b: 56, result: 124 }) === "Nice! 68 + 56 = 124.",
        "prompt formatting substitutes equation values");
      const stateKeys = [
        [{ phase: "completed" }, "completed"],
        [{ phase: "awaiting-answer" }, "awaiting-answer"],
        [{ phase: "carrying-to-tens", animationState: null }, "carrying-ones"],
        [{ phase: "counting-ones", animationState: "ones" }, "carrying-ones"],
        [{ phase: "carrying-to-hundreds", animationState: null }, "carrying-hundreds"],
        [{ phase: "counting-tens", animationState: "hundreds" }, "carrying-hundreds"],
        [{ phase: "counting-tens", skipMessage: true, tensCursor: 0 }, "skip-zero-ones"],
        [{ phase: "counting-ones" }, "counting-ones"],
        [{ phase: "counting-tens", visibleOnesCarry: true }, "counting-tens-with-carry"],
        [{ phase: "counting-tens", visibleOnesCarry: false }, "counting-tens"],
        [{ phase: "unknown" }, "place-value-fallback"]
      ];
      assert(stateKeys.every(([candidate, expected]) => api.promptKeyForState(candidate) === expected),
        "game states map to the correct beetle prompt pools");
      assert(api.deriveProblem(1, 99).result === 100, "deriveProblem accepts a single-digit boundary");
      assert(api.deriveProblem(99, 99).result === 198, "deriveProblem supports the maximum result");
      let rangeRejected = false;
      try { api.deriveProblem(0, 10); } catch (error) { rangeRejected = error.name === "RangeError"; }
      assert(rangeRejected, "deriveProblem rejects operands outside 1–99");

      const examples = [
        [1, 4, 5], [2, 9, 10], [3, 1, 9], [4, 8, 82], [5, 10, 10],
        [6, 49, 49], [7, 50, 50], [8, 50, 50], [9, 99, 99]
      ];
      examples.forEach(([level, a, b]) => {
        assert(api.problemMatchesLevel(api.deriveProblem(a, b), level), "representative operands match L" + level);
      });
      assert(!api.problemMatchesLevel(api.deriveProblem(9, 91), 4), "L4 excludes a three-digit result");
      assert(api.problemMatchesLevel(api.deriveProblem(50, 50), 8, "tens-only"), "L8 tags its tens-only pattern");
      assert(api.problemMatchesLevel(api.deriveProblem(55, 55), 8, "both-carries"), "L8 tags its both-carries pattern");

      for (let level = 1; level <= 9; level += 1) {
        let allValid = true;
        for (let index = 0; index < 40; index += 1) {
          const model = api.generateProblemForLevel(level);
          allValid &&= model.curriculumLevel === level && api.problemMatchesLevel(model, level, model.curriculumPattern);
        }
        assert(allValid, "40 generated L" + level + " problems are valid and tagged");
      }
      const l8Tens = api.generateProblemForLevel(8, new Set(), sequence(.499, 0, 0));
      const l8Both = api.generateProblemForLevel(8, new Set(), sequence(.5, 0, 0));
      assert(l8Tens.curriculumPattern === "tens-only", "L8 roll below 50% selects tens-only carry");
      assert(l8Both.curriculumPattern === "both-carries", "L8 roll at 50% selects both-column carries");
      const l2Left = api.generateProblemForLevel(2, new Set(), sequence(0, .49));
      const l2Right = api.generateProblemForLevel(2, new Set(), sequence(0, .5));
      assert(l2Left.a < 10 && l2Right.b < 10, "L2 randomizes which side has the single-digit addend");
      const l4Left = api.generateProblemForLevel(4, new Set(), sequence(0, .49));
      const l4Right = api.generateProblemForLevel(4, new Set(), sequence(0, .5));
      assert(l4Left.a < 10 && l4Right.b < 10, "L4 randomizes which side has the single-digit addend");

      assert(api.selectCurriculumLevel(1, sequence(.7499)) === 1, "L1 roll below 75% selects L1");
      assert(api.selectCurriculumLevel(1, sequence(.75)) === 2, "L1 roll at 75% selects L2");
      assert(api.selectCurriculumLevel(5, sequence(.4999)) === 5, "standard roll below 50% selects current level");
      assert(api.selectCurriculumLevel(5, sequence(.5)) === 6, "standard roll at 50% selects the higher level");
      assert(api.selectCurriculumLevel(5, sequence(.75, 0)) === 1, "standard roll at 75% enters lower-level review");
      for (let lower = 1; lower < 5; lower += 1) {
        const lowerRoll = (lower - .5) / 4;
        assert(api.selectCurriculumLevel(5, sequence(.9, lowerRoll)) === lower, "uniform review can select L" + lower);
      }
      assert(api.selectCurriculumLevel(9, sequence(.5999)) === 9, "L9 roll below 60% selects L9");
      for (let review = 1; review <= 8; review += 1) {
        const reviewRoll = (review - .5) / 8;
        assert(api.selectCurriculumLevel(9, sequence(.6, reviewRoll)) === review, "L9 review can select L" + review);
      }

      function freshAt(level) {
        return { ...api.defaultProfile(), currentLevel: level, currentLevelSuccesses: 0, higherLevelSuccesses: 0 };
      }
      let progress = freshAt(3);
      for (let count = 1; count <= 3; count += 1) {
        const transition = api.applyProgressForSuccess(progress, 3);
        progress = transition.profile;
        assert(!transition.advanced && progress.currentLevel === 3, "current-level success " + count + " does not advance early");
      }
      let transition = api.applyProgressForSuccess(progress, 3);
      assert(transition.advanced && transition.profile.currentLevel === 4, "fourth current-level success advances exactly one level");
      assert(transition.profile.currentLevelSuccesses === 0 && transition.profile.higherLevelSuccesses === 0, "advancement resets both counters");

      progress = freshAt(3);
      transition = api.applyProgressForSuccess(progress, 7);
      assert(!transition.advanced && transition.profile.higherLevelSuccesses === 1, "first higher-level success does not advance early");
      transition = api.applyProgressForSuccess(transition.profile, 9);
      assert(transition.advanced && transition.profile.currentLevel === 4, "second higher-level success advances only one level");

      progress = freshAt(5);
      progress = api.applyProgressForSuccess(progress, 5).profile;
      progress = api.applyProgressForSuccess(progress, 8).profile;
      assert(progress.currentLevelSuccesses === 1 && progress.higherLevelSuccesses === 1, "advancement counters remain independent");
      const lowerTransition = api.applyProgressForSuccess(progress, 4);
      assert(lowerTransition.credit === "none" && lowerTransition.profile.currentLevelSuccesses === 1 && lowerTransition.profile.higherLevelSuccesses === 1,
        "lower-level success earns no advancement credit");
      const diagnosticTransition = api.applyProgressForSuccess(progress, undefined);
      assert(diagnosticTransition.credit === "none", "untagged diagnostic success earns no advancement credit");
      progress = freshAt(1);
      progress = api.applyProgressForSuccess(progress, 9).profile;
      transition = api.applyProgressForSuccess(progress, 9);
      assert(transition.profile.currentLevel === 2, "higher-level credit never skips a level");
      progress = freshAt(9);
      transition = api.applyProgressForSuccess(progress, 9);
      assert(!transition.advanced && transition.profile.currentLevel === 9 && transition.profile.currentLevelSuccesses === 0, "L9 is capped");

      const migrated = api.validateProfile({ schemaVersion: 1, score: 70, emojiProgress: 7, sound: false, updatedAt: 123 });
      assert(migrated.schemaVersion === 2 && migrated.score === 70 && migrated.emojiProgress === 7 && !migrated.sound,
        "v1 migration preserves rewards and sound");
      assert(migrated.currentLevel === 1 && migrated.currentLevelSuccesses === 0 && migrated.higherLevelSuccesses === 0,
        "v1 migration initializes L1 counters");

      frame = await openGame("?a=1&b=1");
      let productionMotionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      productionMotionApi.clearEvents();
      frame.contentDocument.querySelector(".unit.eligible").click();
      await waitFor(() => productionMotionApi.snapshot().onesLandedCursor === 1, "real-duration production drop", 3000);
      const productionDropEvents = productionMotionApi.events();
      const productionDropStart = productionDropEvents.find(event => event.type === "drop-start");
      const productionDropLanded = productionDropEvents.find(event => event.type === "drop-landed");
      assert(productionDropStart && productionDropLanded && productionDropLanded.at - productionDropStart.at >= 480,
        "non-harness drops retain the full production teaching duration");

      frame = await openGame("?a=9&b=9&harness=1");
      let motionDoc = frame.contentDocument;
      let motionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      motionApi.clearEvents();
      const onesSource = motionDoc.querySelector('[data-motion-role="source"][data-place="ones"][data-index="0"]');
      const onesTarget = motionDoc.querySelector('[data-motion-role="result"][data-place="ones"][data-index="0"]');
      const onesSourceRect = onesSource.getBoundingClientRect();
      const onesTargetRect = onesTarget.getBoundingClientRect();
      assert(onesSource.tagName === "BUTTON" && onesSource.getAttribute("aria-label") &&
        onesSourceRect.width > 0 && onesTargetRect.width > 0 && onesSourceRect.top < onesTargetRect.top,
        "keyboard-capable ones sources and result slots expose stable, live downward geometry");
      assert(onesTarget.classList.contains("empty-unit") && motionApi.snapshot().beetleReactionCount === 0,
        "the first result target is hidden and the beetle does not animate on initial render");
      onesSource.click();
      let motionSnapshot = motionApi.snapshot();
      assert(motionSnapshot.onesAcceptedCursor === 1 && motionSnapshot.onesLandedCursor === 0 && motionSnapshot.queueLength === 1,
        "a tap acknowledges the source before its result lands");
      assert(motionDoc.querySelector('[data-motion-role="result"][data-place="ones"][data-index="0"]').classList.contains("empty-unit"),
        "an accepted result remains hidden during flight");
      assert(motionSnapshot.activeOverlayCount === 1 && motionDoc.querySelectorAll(".motion-overlay").length === 1,
        "the first queued drop creates exactly one noninteractive overlay");
      assert(motionDoc.querySelector("#resetCurrent").disabled && motionDoc.querySelector("#answerButton").disabled &&
        motionDoc.querySelector("#settingsButton").disabled && motionDoc.querySelector(".dice").disabled,
        "reset, answer, Settings, and alternatives lock while queued motion drains");
      for (let index = 1; index < 10; index += 1) {
        const next = motionDoc.querySelector(".unit.eligible");
        if (!next) throw new Error("rapid ones queue closed before the first trade boundary");
        next.click();
      }
      motionSnapshot = motionApi.snapshot();
      assert(motionSnapshot.onesAcceptedCursor === 10 && motionSnapshot.onesLandedCursor === 0 &&
        !motionDoc.querySelector(".unit.eligible") && motionSnapshot.activeOverlayCount === 1,
        "rapid taps queue through ten, close the boundary, and keep one active overlay");
      await waitFor(() => {
        const snapshot = motionApi.snapshot();
        return snapshot.visibleOnesCarry && snapshot.phase === "counting-ones";
      }, "ones carry lifecycle completion", 8000);
      motionSnapshot = motionApi.snapshot();
      assert(motionSnapshot.onesAcceptedCursor === 10 && motionSnapshot.onesLandedCursor === 10 &&
        motionDoc.querySelector('.unit.eligible[data-place="ones"][data-index="10"]'),
        "the ones queue reopens only after the carried ten lands");
      assert(motionDoc.querySelector('[data-carry-destination="tens"].owner-carry'),
        "the permanent carried ten appears at the measured Tens destination");
      let motionEvents = motionApi.events();
      const dropStarts = motionEvents.filter(event => event.type === "drop-start" && event.place === "ones");
      const dropLandings = motionEvents.filter(event => event.type === "drop-landed" && event.place === "ones");
      assert(dropStarts.length === 10 && dropLandings.length === 10 && dropLandings.every((event, index) => event.index === index),
        "rapid ones drops replay and land sequentially in accepted order");
      assert(dropStarts.slice(1).every((event, index) => motionEvents.indexOf(event) > motionEvents.indexOf(dropLandings[index])),
        "the next drop overlay starts only after the prior overlay lands");
      const carryFormationIndex = motionEvents.findIndex(event => event.type === "carry-formation" && event.kind === "ones");
      const carryTravelIndex = motionEvents.findIndex(event => event.type === "carry-travel" && event.kind === "ones");
      const carryLandingIndex = motionEvents.findIndex(event => event.type === "carry-landing" && event.kind === "ones");
      const carryLandedIndex = motionEvents.findIndex(event => event.type === "carry-landed" && event.kind === "ones");
      assert(carryFormationIndex >= 0 && carryFormationIndex < carryTravelIndex && carryTravelIndex < carryLandingIndex && carryLandingIndex < carryLandedIndex,
        "ones carry records formation, measured travel, bounce, and permanent landing in order");
      assert(motionSnapshot.beetleReactionCount === 2 &&
        motionEvents.filter(event => event.type === "beetle-reaction").length === 2,
        "the beetle reacts once per changed carry message and ignores unrelated queue renders");
      assert(motionSnapshot.soundEffectCount > 0, "Sound on produces synchronized drop, carry, and beetle effects");
      for (let index = 10; index < 18; index += 1) motionDoc.querySelector(".unit.eligible").click();
      await waitFor(() => motionApi.snapshot().phase === "counting-tens", "remaining ones queue drain", 8000);

      frame = await openGame("?a=90&b=90&harness=1");
      motionDoc = frame.contentDocument;
      motionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      motionApi.clearEvents();
      const tensSource = motionDoc.querySelector('[data-motion-role="source"][data-place="tens"][data-index="0"]');
      const tensTarget = motionDoc.querySelector('[data-motion-role="result"][data-place="tens"][data-index="0"]');
      assert(tensSource.getBoundingClientRect().top < tensTarget.getBoundingClientRect().top &&
        tensSource.getBoundingClientRect().width > 0 && tensTarget.getBoundingClientRect().width > 0,
        "tens sources and result slots expose stable, live downward geometry");
      for (let index = 0; index < 10; index += 1) motionDoc.querySelector(".unit.eligible").click();
      motionSnapshot = motionApi.snapshot();
      assert(motionSnapshot.tensAcceptedCursor === 10 && motionSnapshot.tensLandedCursor === 0 && !motionDoc.querySelector(".unit.eligible"),
        "the Tens queue also closes at its group-of-ten boundary");
      await waitFor(() => {
        const snapshot = motionApi.snapshot();
        return snapshot.visibleHundredsCarry && snapshot.phase === "counting-tens";
      }, "compact hundreds carry lifecycle", 8000);
      assert(motionDoc.querySelector('.unit.eligible[data-place="tens"][data-index="10"]'),
        "the Tens queue reopens after the carried hundred settles");
      motionEvents = motionApi.events();
      assert(motionEvents.some(event => event.type === "carry-compact-settle" && event.kind === "hundreds" && !event.destinationVisible) &&
        !motionEvents.some(event => event.type === "carry-travel" && event.kind === "hundreds"),
        "a diagnostic hidden-Hundreds carry settles in its source cell without off-screen travel");

      frame = await openGame("?a=2&b=3&harness=1&reducedMotion=1");
      motionDoc = frame.contentDocument;
      motionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      motionApi.clearEvents();
      const reducedCurrentCard = motionDoc.querySelector(".suggestion.current");
      const reducedCurrentMarkup = reducedCurrentCard.innerHTML;
      const reducedDice = motionDoc.querySelector(".dice");
      const reducedDiceSoundBaseline = motionApi.snapshot().soundEffectCount;
      const reducedDiceStarted = performance.now();
      reducedDice.focus();
      reducedDice.click();
      const staticAlternatives = Array.from(motionDoc.querySelectorAll(".suggestion:not(.current)"));
      assert(motionApi.snapshot().diceRefreshState === "static-highlight" && !reducedDice.classList.contains("rolling") &&
        staticAlternatives.length === 3 && staticAlternatives.every(button =>
          button.classList.contains("refresh-static") && button.dataset.refreshEmphasis === "static"),
        "reduced motion refreshes immediately with a static highlight and no die tumble");
      assert(motionDoc.querySelector(".suggestion.current") === reducedCurrentCard && reducedCurrentCard.innerHTML === reducedCurrentMarkup &&
        !reducedCurrentCard.classList.contains("refresh-static"),
        "reduced motion also leaves the current card stable and unhighlighted");
      await waitFor(() => motionApi.snapshot().diceRefreshState === "idle", "reduced-motion dice refresh");
      const reducedDiceEvents = motionApi.events();
      assert(performance.now() - reducedDiceStarted < 500 &&
        !reducedDiceEvents.some(event => event.type === "dice-tumble-start" || event.type === "dice-face") &&
        reducedDiceEvents.filter(event => event.type === "dice-card-emphasis" && event.reduced).length === 3 &&
        Array.from(motionDoc.querySelectorAll(".suggestion:not(.current)"))
          .every(button => button.dataset.refreshEmphasis === "static"),
        "reduced-motion dice refresh completes promptly without tumble or stagger movement");
      assert(motionApi.snapshot().soundEffectCount > reducedDiceSoundBaseline && motionDoc.activeElement === reducedDice &&
        !motionDoc.querySelector("#suggestionTray").hasAttribute("aria-busy"),
        "reduced motion keeps optional dice audio and restores focus and busy state");
      motionDoc.querySelector("#settingsButton").click();
      motionDoc.querySelector("#settingsSoundButton").click();
      motionDoc.querySelector("#closeSettings").click();
      const silentBaseline = motionApi.snapshot().soundEffectCount;
      motionApi.clearEvents();
      motionDoc.querySelector(".unit.eligible").click();
      await waitFor(() => motionApi.snapshot().onesLandedCursor === 1, "reduced-motion immediate commit");
      motionSnapshot = motionApi.snapshot();
      assert(motionSnapshot.reducedMotion && motionSnapshot.activeOverlayCount === 0 &&
        motionApi.events().some(event => event.type === "drop-static") && !motionApi.events().some(event => event.type === "drop-start"),
        "reduced motion commits immediately with a static target flash and no travel overlay");
      assert(motionSnapshot.soundEffectCount === silentBaseline,
        "Sound off gates reduced-motion learning effects");
      await countNextUnits(frame, 4);
      const reducedAnswer = motionDoc.querySelector("#answerButton");
      assert(reducedAnswer.textContent === "?" && reducedAnswer.classList.contains("answer-ready") &&
        reducedAnswer.classList.contains("motion-reduced") && getComputedStyle(reducedAnswer).animationName === "none",
        "reduced motion replaces the finished-count question-mark flash with a strong static highlight");
      await enterAnswer(frame, 5);
      const reducedNext = motionDoc.querySelector("#nextButton");
      assert(!reducedNext.hidden && reducedNext.classList.contains("success-next") && reducedNext.classList.contains("motion-reduced") &&
        getComputedStyle(reducedNext).animationName === "none",
        "reduced motion replaces the successful Next animation with a strong static highlight");
      assert(motionApi.snapshot().soundEffectCount === silentBaseline,
        "Sound off also gates completion effects while the Next highlight remains visual");
      motionDoc.querySelector("#settingsButton").click();
      motionDoc.querySelector("#settingsSoundButton").click();
      motionDoc.querySelector("#closeSettings").click();

      frame = await openGame("?a=2&b=3&harness=1");
      motionDoc = frame.contentDocument;
      motionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      motionDoc.querySelector(".unit.eligible").click();
      frame.contentWindow.dispatchEvent(new Event("resize"));
      await waitFor(() => motionApi.snapshot().onesLandedCursor === 1 && !motionApi.snapshot().controlsLocked,
        "resize motion settlement");
      assert(motionApi.snapshot().activeOverlayCount === 0,
        "resize interruption removes overlays and safely commits the active drop");

      frame = await openGame("?a=99&b=99&harness=1");
      motionDoc = frame.contentDocument;
      motionApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      motionApi.clearEvents();
      const solverScore = motionDoc.querySelector("#scoreValue").textContent;
      motionDoc.querySelector("#settingsButton").click();
      motionDoc.querySelector("#runSolverButton").click();
      await waitFor(() => motionDoc.querySelector("#answerButton").textContent === "198", "99 plus 99 Solver completion", 20000);
      motionEvents = motionApi.events();
      assert(motionEvents.filter(event => event.type === "drop-landed").length === 37 &&
        motionEvents.some(event => event.type === "carry-landed" && event.kind === "ones") &&
        motionEvents.some(event => event.type === "carry-landed" && event.kind === "hundreds"),
        "Solver uses the full drop and both-carry teaching paths for 99 + 99");
      assert(motionDoc.querySelector("#scoreValue").textContent === solverScore && motionApi.snapshot().activeOverlayCount === 0,
        "99 + 99 Solver finishes cleanly without a reward");
      assert(!motionDoc.querySelector("#nextButton").hidden && motionDoc.querySelector("#nextButton").classList.contains("success-next"),
        "Solver completion highlights the Next action");

      frame = await openGame("?a=2&b=3&harness=1");
      let promptDoc = frame.contentDocument;
      const initialOnesPrompt = promptDoc.querySelector("#promptText").textContent;
      assert(promptMatches(api, "counting-ones", initialOnesPrompt), "a new problem starts with a counting-ones variant");
      const promptRow = promptDoc.querySelector("#promptRow");
      const initialNext = promptDoc.querySelector("#nextButton");
      assert(initialNext.hidden && initialNext.disabled && !promptRow.classList.contains("has-next") &&
        Math.abs(promptRow.getBoundingClientRect().width - promptDoc.querySelector(".speech").getBoundingClientRect().width) < 1,
        "counting hides the redundant Count control and lets the beetle bubble fill the prompt row");
      const firstOne = promptDoc.querySelector(".unit.eligible");
      firstOne.click();
      await waitFor(() => frame.contentWindow.NumberGarden.motionDiagnostics.snapshot().onesLandedCursor === 1,
        "first one landed for prompt stability");
      assert(promptDoc.querySelector("#promptText").textContent === initialOnesPrompt,
        "the beetle prompt stays stable during repeated renders of one learning step");
      promptDoc.querySelector("#resetCurrent").click();
      const resetOnesPrompt = promptDoc.querySelector("#promptText").textContent;
      assert(promptMatches(api, "counting-ones", resetOnesPrompt) && resetOnesPrompt !== initialOnesPrompt,
        "resetting a problem selects a different counting-ones variant");
      await countNextUnits(frame, 5);
      await waitFor(() => frame.contentWindow.NumberGarden.motionDiagnostics.snapshot().phase === "awaiting-answer", "answer step after counting ones");
      assert(promptMatches(api, "awaiting-answer", promptDoc.querySelector("#promptText").textContent),
        "finished counting shows an awaiting-answer variant");
      const readyAnswer = promptDoc.querySelector("#answerButton");
      assert(initialNext.hidden && initialNext.disabled && !promptRow.classList.contains("has-next") &&
        promptRow.querySelectorAll("button:not([hidden])").length === 0 && readyAnswer.textContent === "?" && readyAnswer.classList.contains("answer-ready") &&
        getComputedStyle(readyAnswer).animationName === "answer-ready-pulse" &&
        getComputedStyle(readyAnswer).animationDuration === "0.65s" &&
        getComputedStyle(readyAnswer).animationIterationCount === "infinite",
        "finished counting keeps ? as the only answer control and continuously flashes it in sync with action feedback");
      await enterAnswer(frame, 5);
      assert(!promptDoc.querySelector("#answerButton").classList.contains("answer-ready"),
        "answer completion stops the question-mark flash");
      assert(promptMatches(api, "completed", promptDoc.querySelector("#promptText").textContent, { a: 2, b: 3, result: 5 }),
        "manual completion shows a correctly formatted completion variant");
      const completedNext = promptDoc.querySelector("#nextButton");
      assert(!completedNext.hidden && !completedNext.disabled && promptRow.classList.contains("has-next") &&
        completedNext.classList.contains("success-next") &&
        getComputedStyle(completedNext).animationName === "success-next-pulse" &&
        getComputedStyle(completedNext).animationIterationCount === "infinite",
        "successful manual completion continuously highlights and animates Next");

      frame = await openGame("?a=12&b=23&harness=1");
      promptDoc = frame.contentDocument;
      await countNextUnits(frame, 5);
      assert(promptMatches(api, "counting-tens", promptDoc.querySelector("#promptText").textContent),
        "a no-carry problem shows a counting-tens variant after ones");

      frame = await openGame("?a=10&b=20&harness=1");
      promptDoc = frame.contentDocument;
      assert(promptMatches(api, "skip-zero-ones", promptDoc.querySelector("#promptText").textContent),
        "a zero-ones problem shows a skip-zero-ones variant");

      frame = await openGame("?a=7&b=5&harness=1");
      promptDoc = frame.contentDocument;
      await countNextUnits(frame, 9);
      const tenthOne = promptDoc.querySelector(".unit.eligible");
      tenthOne.click();
      await waitFor(() => promptMatches(api, "carrying-ones", promptDoc.querySelector("#promptText").textContent), "ones carry prompt");
      assert(promptMatches(api, "carrying-ones", promptDoc.querySelector("#promptText").textContent),
        "a ones carry shows a carrying-ones variant");
      await waitFor(() => promptDoc.querySelector(".unit.eligible"), "ones carry animation completed", 2000);
      await countNextUnits(frame, 2);
      assert(promptMatches(api, "counting-tens-with-carry", promptDoc.querySelector("#promptText").textContent),
        "tens counting after an ones carry shows the carried-ten instructions");

      frame = await openGame("?a=50&b=50&harness=1");
      promptDoc = frame.contentDocument;
      await countNextUnits(frame, 9);
      const tenthTen = promptDoc.querySelector(".unit.eligible");
      tenthTen.click();
      await waitFor(() => promptMatches(api, "carrying-hundreds", promptDoc.querySelector("#promptText").textContent), "hundreds carry prompt");
      assert(promptMatches(api, "carrying-hundreds", promptDoc.querySelector("#promptText").textContent),
        "a tens carry shows a carrying-hundreds variant");

      frame = await openGame("?a=97&b=87&harness=1");
      const carryDoc = frame.contentDocument;
      await countNextUnits(frame, 9);
      let placeLabel = carryDoc.querySelector(".result-panel.ones .digit-label");
      assert(placeLabel.textContent === "9" && !placeLabel.querySelector(".carry-digit"),
        "single-digit place counts use the normal digit style");
      await countNextUnits(frame, 1);
      placeLabel = carryDoc.querySelector(".result-panel.ones .digit-label");
      assert(placeLabel.textContent === "10" && placeLabel.querySelector(".carry-digit").textContent === "1",
        "ten ones dims the carried leading digit");
      await countNextUnits(frame, 4);
      placeLabel = carryDoc.querySelector(".result-panel.ones .digit-label");
      const carriedDigit = placeLabel.querySelector(".carry-digit");
      const remainderDigit = placeLabel.querySelector(".place-count span:last-child");
      assert(placeLabel.textContent === "14" && placeLabel.querySelector(".carry-digit").textContent === "1" &&
        placeLabel.getAttribute("aria-label") === "14 ones counted",
        "14 ones dims only the carried one and keeps one accessible count");
      assert(getComputedStyle(carriedDigit).color === "rgb(174, 182, 194)" &&
        getComputedStyle(remainderDigit).color === "rgb(72, 86, 108)",
        "carried and remainder digits use faint and normal gray respectively");
      await countNextUnits(frame, 18);
      placeLabel = carryDoc.querySelector(".result-panel.tens .digit-label");
      assert(placeLabel.textContent === "18" && placeLabel.querySelector(".carry-digit").textContent === "1" &&
        placeLabel.getAttribute("aria-label") === "18 tens counted",
        "18 tens dims only the carried hundred and keeps one accessible count");
      carryDoc.querySelector("#settingsButton").click();
      carryDoc.querySelector("#runSolverButton").click();
      await waitFor(() => carryDoc.querySelector("#answerButton").textContent === "184", "carry example Solver completion");
      const completedLabels = carryDoc.querySelectorAll(".result-panel .digit-label");
      assert(Array.from(completedLabels).every(label => !label.querySelector(".carry-digit")),
        "completed place-value remainder labels use the normal digit style");

      frame = await openGame("?harness=1");

      const doc = frame.contentDocument;
      assert(doc.querySelector(".bee").nextElementSibling.id === "levelBadge", "level badge is immediately right of the bee");
      assert(!doc.querySelector("#soundButton") && doc.querySelector("#settingsSoundButton"), "sound control lives in Settings");
      assert(doc.querySelector("#board").classList.contains("compact") && !doc.querySelector(".column-title.hundreds"),
        "L1 board collapses to Labels, Tens, and Ones");

      doc.querySelector("#settingsButton").click();
      assert(doc.activeElement === doc.querySelector("#settingsTitle"),
        "Settings opens with its title focused instead of expanding the practice-level select");
      const settingsDialog = doc.querySelector("#settingsDialog");
      doc.querySelector("#settingsTitle").click();
      assert(settingsDialog.open, "clicking inside Settings keeps it open");
      settingsDialog.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: 0, clientY: 0 }));
      assert(!settingsDialog.open && settingsDialog.returnValue === "cancel",
        "clicking outside Settings dismisses it like Cancel");

      doc.querySelector("#settingsButton").click();
      doc.querySelector("#openAboutButton").click();
      assert(settingsDialog.open && doc.querySelector("#settingsView").hidden && !doc.querySelector("#aboutView").hidden &&
        doc.querySelector("#settingsTitle").textContent === "About" && doc.activeElement === doc.querySelector("#settingsTitle"),
        "About replaces Settings inside the same dialog and focuses its title");
      const aboutValues = Array.from(doc.querySelectorAll(".about-details dd"), item => item.textContent);
      assert(JSON.stringify(aboutValues) === JSON.stringify(["Joydip Datta", "0.1a_29e687", "All rights reserved."]),
        "About shows the author, commit-stamped version, and license");
      assert(doc.querySelector("#settingsBackButton").getAttribute("aria-label") === "Back to settings",
        "About provides an accessible back arrow");
      doc.querySelector("#settingsBackButton").click();
      assert(!doc.querySelector("#settingsView").hidden && doc.querySelector("#aboutView").hidden &&
        doc.querySelector("#settingsTitle").textContent === "Garden settings" && doc.activeElement === doc.querySelector("#openAboutButton"),
        "the About back arrow restores Settings and returns focus to its trigger");
      doc.querySelector("#openAboutButton").click();
      settingsDialog.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: 0, clientY: 0 }));
      assert(!settingsDialog.open, "clicking outside About dismisses the shared Settings dialog");
      doc.querySelector("#settingsButton").click();
      assert(!doc.querySelector("#settingsView").hidden && doc.querySelector("#aboutView").hidden &&
        doc.querySelector("#settingsTitle").textContent === "Garden settings",
        "reopening Settings after dismissing About starts on the main view");
      settingsDialog.close();

      const keypadDialog = doc.querySelector("#keypadDialog");
      const answerButton = doc.querySelector("#answerButton");
      answerButton.dispatchEvent(new Event("pointerdown", { bubbles: true }));
      answerButton.dispatchEvent(new Event("pointerup", { bubbles: true }));
      assert(!keypadDialog.open, "the answer dialog waits for the tap's click before opening");
      answerButton.click();
      assert(keypadDialog.open, "the completed tap opens the answer dialog without a trailing activation");
      doc.querySelector("#keypadTitle").click();
      assert(keypadDialog.open, "clicking inside the answer dialog keeps it open");
      keypadDialog.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: 0, clientY: 0 }));
      assert(!keypadDialog.open && keypadDialog.returnValue === "cancel",
        "clicking outside the answer dialog dismisses it like Cancel");

      doc.querySelector("#settingsButton").click();
      doc.querySelector("#levelSelect").value = "6";
      doc.querySelector("#levelSelect").dispatchEvent(new Event("change", { bubbles: true }));
      await waitFor(() => doc.querySelector("#levelBadge").textContent === "L6" && doc.querySelector(".column-title.hundreds"), "L6 override");
      assert(doc.querySelector("#board").classList.contains("unlocking"), "crossing to L6 activates the Hundreds unlock highlight");
      await waitFor(() => doc.querySelector("#liveRegion").textContent.includes("Hundreds column is now unlocked"), "Hundreds unlock announcement");
      assert(doc.querySelector("#liveRegion").textContent.includes("Hundreds column is now unlocked"), "Hundreds unlock is announced");
      const storedL6 = profileCookie();
      assert(storedL6 && storedL6.schemaVersion === 2 && storedL6.currentLevel === 6 && storedL6.currentLevelSuccesses === 0 && storedL6.higherLevelSuccesses === 0,
        "manual level override persists L6 with reset counters");

      frame = await openGame("?a=50&b=50&harness=1");
      const fullCarryDoc = frame.contentDocument;
      const fullCarryApi = frame.contentWindow.NumberGarden.motionDiagnostics;
      fullCarryApi.clearEvents();
      const hundredCarryStyles = { formation: null, travel: null };
      const carryStyleSnapshot = element => {
        const style = frame.contentWindow.getComputedStyle(element);
        return {
          borderTopColor: style.borderTopColor,
          backgroundImage: style.backgroundImage,
          boxShadow: style.boxShadow
        };
      };
      const captureHundredCarryStyles = () => {
        const formation = fullCarryDoc.querySelector('[data-carry-origin="hundreds"]');
        const travel = fullCarryDoc.querySelector('.motion-overlay.carry-token.hundred-token');
        if (formation && !hundredCarryStyles.formation) hundredCarryStyles.formation = carryStyleSnapshot(formation);
        if (travel && !hundredCarryStyles.travel) hundredCarryStyles.travel = carryStyleSnapshot(travel);
      };
      const hundredCarryObserver = new MutationObserver(captureHundredCarryStyles);
      hundredCarryObserver.observe(fullCarryDoc.body, { childList: true, subtree: true });
      await countNextUnits(frame, 10);
      await waitFor(() => fullCarryApi.snapshot().visibleHundredsCarry && fullCarryApi.snapshot().phase === "awaiting-answer",
        "visible Hundreds carry completion", 8000);
      hundredCarryObserver.disconnect();
      const fullCarryEvents = fullCarryApi.events();
      const hundredFormationIndex = fullCarryEvents.findIndex(event => event.type === "carry-formation" && event.kind === "hundreds");
      const hundredTravelIndex = fullCarryEvents.findIndex(event => event.type === "carry-travel" && event.kind === "hundreds" && event.destination === "hundreds");
      const hundredLandingIndex = fullCarryEvents.findIndex(event => event.type === "carry-landing" && event.kind === "hundreds");
      const hundredLandedIndex = fullCarryEvents.findIndex(event => event.type === "carry-landed" && event.kind === "hundreds");
      assert(hundredFormationIndex >= 0 && hundredFormationIndex < hundredTravelIndex &&
        hundredTravelIndex < hundredLandingIndex && hundredLandingIndex < hundredLandedIndex,
        "an unlocked Hundreds carry records formation, measured travel, bounce, and permanent landing in order");
      const goldCarryStyle = style => style && style.borderTopColor === "rgb(155, 91, 0)" &&
        style.backgroundImage.includes("repeating-linear-gradient") && style.boxShadow !== "none";
      assert(goldCarryStyle(hundredCarryStyles.formation) && goldCarryStyle(hundredCarryStyles.travel),
        "the forming and in-flight hundred use the gold striped carry border, fill, and glow");
      const landedHundred = fullCarryDoc.querySelector('[data-carry-destination="hundreds"].filled');
      assert(landedHundred && goldCarryStyle(carryStyleSnapshot(landedHundred)),
        "the permanent 100 destination remains gold striped and glowing after landing");

      frame = await openGame("?reload=1");
      const reloadedDoc = frame.contentDocument;
      assert(reloadedDoc.querySelector("#levelBadge").textContent === "L6", "level persists across reload");
      assert(reloadedDoc.querySelector(".column-title.hundreds") && !reloadedDoc.querySelector("#board").classList.contains("unlocking"),
        "ordinary reload shows Hundreds without replaying its unlock");

      reloadedDoc.querySelector("#settingsButton").click();
      reloadedDoc.querySelector("#settingsSoundButton").click();
      assert(reloadedDoc.querySelector("#settingsSoundButton").getAttribute("aria-pressed") === "false" && profileCookie().sound === false,
        "Settings sound toggle is accessible and persistent");
      reloadedDoc.defaultView.confirm = () => true;
      reloadedDoc.querySelector("#resetProgressButton").click();
      await waitFor(() => reloadedDoc.querySelector("#levelBadge").textContent === "L1" && reloadedDoc.querySelector("#scoreValue").textContent === "0", "progress reset", 10000);
      const reset = profileCookie();
      assert(reset.currentLevel === 1 && reset.currentLevelSuccesses === 0 && reset.higherLevelSuccesses === 0 && reset.score === 0 && reset.emojiProgress === 0 && !reset.sound,
        "Reset Progress clears level counters and rewards while retaining sound");

      reloadedDoc.querySelector("#toast").classList.remove("show");
      reloadedDoc.querySelector("#toast").textContent = "";
      reloadedDoc.querySelector("#settingsButton").click();
      reloadedDoc.querySelector("#runSolverButton").click();
      await waitFor(() => reloadedDoc.querySelector("#answerButton").textContent !== "?", "Solver completion", 8000);
      assert(reloadedDoc.querySelector("#scoreValue").textContent === "0" && profileCookie().score === 0 && profileCookie().emojiProgress === 0,
        "Solver changes neither rewards nor persistent progress");
      assert(!reloadedDoc.querySelector("#toast").classList.contains("show") && reloadedDoc.querySelector("#toast").textContent === "",
        "Solver shows no reward toast");

      reloadedDoc.querySelector("#nextButton").click();
      const answer = Number(reloadedDoc.querySelector("#equationA").textContent) + Number(reloadedDoc.querySelector("#equationB").textContent);
      await enterAnswer(frame, answer, true);
      assert(reloadedDoc.querySelector("#scoreValue").textContent === "10" && profileCookie().score === 10 && profileCookie().emojiProgress === 1,
        "manual completion after a wrong attempt awards exactly one reward");

      document.body.dataset.status = "passed";
      document.title = "PASS: Number Garden curriculum checks";
      results.textContent = checks.join("\n") + "\n\n" + checks.length + " checks passed.";
    }

    run().catch(error => {
      document.body.dataset.status = "failed";
      document.title = "FAIL: Number Garden curriculum checks";
      const currentFrame = document.querySelector("iframe");
      const motionApi = currentFrame && currentFrame.contentWindow.NumberGarden && currentFrame.contentWindow.NumberGarden.motionDiagnostics;
      const diagnostic = motionApi ? "\n\nMOTION: " + JSON.stringify(motionApi.snapshot()) +
        "\nEVENTS: " + JSON.stringify(motionApi.events()) : "";
      results.textContent = checks.join("\n") + "\n\nFAIL: " + (error.stack || error.message) + diagnostic;
    });
  </script>
</body>
</html>

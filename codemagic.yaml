workflows:
  ios-smoke:
    name: Number Garden - iOS Smoke Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: number-garden

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Generate Capacitor iOS project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Number Garden curriculum checks</title>
</head>
<body data-status="running">
  <h1>Number Garden curriculum checks</h1>
  <pre id="results">Running…</pre>
  <script>
    "use strict";

    const results = document.querySelector("#results");
    const checks = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      checks.push("PASS: " + message);
    }

    function sequence(...values) {
      return () => values.length ? values.shift() : 0;
    }

    function promptMatches(api, key, text, values = {}) {
      return api.PROMPT_POOLS[key].some(template => api.formatPrompt(template, values) === text);
    }

    function waitFor(predicate, message, timeout = 5000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        function check() {
          if (predicate()) return resolve();
          if (performance.now() - started >= timeout) return reject(new Error("Timed out: " + message));
          setTimeout(check, 20);
        }
        check();
      });
    }

    function clearDatabase() {
      return new Promise(resolve => {
        const request = indexedDB.deleteDatabase("numberGarden");
        request.onsuccess = request.onerror = request.onblocked = () => resolve();
      });
    }

    function profileCookie() {
      const part = document.cookie.split(";").map(item => item.trim()).find(item => item.startsWith("numberGardenProgress="));
      return part ? JSON.parse(decodeURIComponent(part.slice("numberGardenProgress=".length))) : null;
    }

    function indexedProfile() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("numberGarden", 1);
        request.onerror = () => reject(request.error || new Error("Could not open profile database"));
        request.onsuccess = () => {
          const db = request.result;
          const transaction = db.transaction("state", "readonly");
          const read = transaction.objectStore("state").get("profile");
          read.onsuccess = () => { db.close(); resolve(read.result || null); };
          read.onerror = () => { db.close(); reject(read.error || new Error("Could not read IndexedDB profile")); };
        };
      });
    }

    function analyticsEntries(frame, command, name) {
      return Array.from(frame.contentWindow.dataLayer || []).filter(entry =>
        entry && entry[0] === command && (name === undefined || entry[1] === name));
    }

    async function openGame(query = "", launchChoice = "start") {
      const old = document.querySelector("iframe");
      if (old) old.remove();
      const frame = document.createElement("iframe");
      frame.title = "Game under test";
      frame.src = "../index.html" + query;
      document.body.append(frame);
      await waitFor(() => frame.contentWindow.NumberGarden && frame.contentDocument.querySelector(".row-label"), "game initialization");
      const launchDialog = frame.contentDocument.querySelector("#launchDialog");
      if (launchChoice && launchDialog.open) {
        frame.contentDocument.querySelector(launchChoice === "tutorial" ? "#launchTutorialButton" : "#launchStartButton").click();
        await waitFor(() => !launchDialog.open, "launch " + launchChoice + " choice");
      }
      return frame;
    }

    function enterAnswer(frame, answer, includeWrongAttempt = false) {
      const doc = frame.contentDocument;
      doc.querySelector("#answerButton").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      return waitFor(() => doc.querySelector("#keypadDialog").open, "keypad open").then(() => {
        if (includeWrongAttempt) {
          doc.querySelector('[data-key="' + (Number(answer) === 0 ? "1" : "0") + '"]').click();
          doc.querySelector("#checkAnswer").click();
        }
        String(answer).split("").forEach(digit => doc.querySelector('[data-key="' + digit + '"]').click());
        doc.querySelector("#checkAnswer").click();
        return waitFor(() => doc.querySelector("#answerButton").textContent === String(answer), "manual completion");
      });
    }

    async function countNextUnits(frame, count) {
      const doc = frame.contentDocument;
      const diagnostics = frame.contentWindow.NumberGarden.motionDiagnostics;
      for (let index = 0; index < count; index += 1) {
        await waitFor(() => doc.querySelector(".unit.eligible"), "eligible unit " + (index + 1));
        const unit = doc.querySelector(".unit.eligible");
        const place = unit.dataset.place;
        const before = diagnostics.snapshot();
        const landedBefore = place === "ones" ? before.onesLandedCursor
          : place === "tens" ? before.tensLandedCursor : before.hundredsLandedCursor;
        unit.click();
        await waitFor(() => {
          const snapshot = diagnostics.snapshot();
          return (place === "ones" ? snapshot.onesLandedCursor
            : place === "tens" ? snapshot.tensLandedCursor : snapshot.hundredsLandedCursor) > landedBefore;
        }, "landed unit " + (index + 1));
      }
    }

    async function holdCurrentAddendCell(frame, input = "pointer") {
      const doc = frame.contentDocument;
      const diagnostics = frame.contentWindow.NumberGarden.motionDiagnostics;
      const completedBefore = diagnostics.events().filter(event => event.type === "quick-drop-complete").length;
      const unit = doc.querySelector(".unit.eligible");
      if (!unit) throw new Error("No eligible unit is available for quick play");
      const panel = unit.closest(".source-panel");
      if (!panel) throw new Error("The eligible unit is not inside an addend cell");
      if (input === "keyboard") {
        unit.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true }));
      } else {
        panel.dispatchEvent(new PointerEvent("pointerdown", {
          bubbles: true, cancelable: true, button: 0,
          clientX: panel.getBoundingClientRect().left + 8,
          clientY: panel.getBoundingClientRect().top + 8
        }));
      }
      await waitFor(() => diagnostics.snapshot().quickPlayHolding, "quick-play hold charge");
      await new Promise(resolve => setTimeout(resolve, diagnostics.snapshot().quickPlayHoldDuration + 30));
      if (input === "keyboard") {
        unit.dispatchEvent(new KeyboardEvent("keyup", { key: " ", bubbles: true, cancelable: true }));
      } else {
        panel.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, cancelable: true, button: 0 }));
      }
      await waitFor(() => diagnostics.events().filter(event => event.type === "quick-drop-complete").length > completedBefore,
        "quick-drop completion");
    }

    async function finishSubtractionCounting(frame, quick = false) {
      const doc = frame.contentDocument;
      const diagnostics = frame.contentWindow.NumberGarden.motionDiagnostics;
      let actions = 0;
      while (diagnostics.snapshot().phase !== "awaiting-answer" && actions < 40) {
        await waitFor(() => doc.querySelector(".unit.eligible") && !diagnostics.snapshot().controlsLocked,
          "next subtraction source unit", 10000);
        if (quick) await holdCurrentAddendCell(frame);
        else {
          doc.querySelector(".unit.eligible").click();
          await waitFor(() => !diagnostics.snapshot().controlsLocked, "subtraction unit landing", 10000);
        }
        actions += 1;
      }
      if (diagnostics.snapshot().phase !== "awaiting-answer") throw new Error("Subtraction counting did not reach the answer phase");
      return actions;
    }

    function colorChannels(color) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 1;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.fillStyle = color;
      context.fillRect(0, 0, 1, 1);
      return Array.from(context.getImageData(0, 0, 1, 1).data);
    }

    function carryLeftoverSnapshot(frame, place) {
      const doc = frame.contentDocument;
      const group = doc.querySelector(".result-panel." + place + " .trade-group");
      const blocks = Array.from(group.querySelectorAll(".unit.traded"));
      return {
        luminosity: frame.contentWindow.getComputedStyle(doc.documentElement)
          .getPropertyValue("--carry-leftover-block-luminosity").trim(),
        outline: frame.contentWindow.getComputedStyle(group).boxShadow,
        blocks: blocks.map(block => {
          const style = frame.contentWindow.getComputedStyle(block);
          return {
            owner: block.dataset.owner,
            fill: colorChannels(style.backgroundColor),
            borderTopColor: style.borderTopColor,
            backgroundImage: style.backgroundImage,
            opacity: style.opacity,
            filter: style.filter
          };
        })
      };
    }

    async function run() {
      document.cookie = "numberGardenProgress=; Max-Age=0; Path=/; SameSite=Lax";
      await clearDatabase();
      let frame = await openGame("?harness=1", null);
      let launchDoc = frame.contentDocument;
      const launchDialog = launchDoc.querySelector("#launchDialog");
      assert(launchDialog.open && launchDialog.getAttribute("aria-labelledby") === "launchTitle" &&
        launchDoc.querySelector("#launchTitle").textContent === "Welcome to Number Garden" &&
        JSON.stringify(Array.from(launchDialog.querySelectorAll("button"), button => button.textContent)) === JSON.stringify(["Start", "Tutorial"]),
        "fresh profiles require the accessible Start or Tutorial launch choice");
      const googleTags = Array.from(launchDoc.querySelectorAll('script[src^="https://www.googletagmanager.com/gtag/js"]'));
      assert(googleTags.length === 1 && new URL(googleTags[0].src).searchParams.get("id") === "G-C3PJ0VBNH0" &&
        analyticsEntries(frame, "config", "G-C3PJ0VBNH0").length === 1,
        "the page installs exactly one Google tag with the configured measurement ID");
      assert(analyticsEntries(frame, "event", "game_start").length === 0,
        "a page visit alone does not emit the gameplay start event");
      launchDialog.dispatchEvent(new Event("cancel", { cancelable: true }));
      launchDialog.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: 0, clientY: 0 }));
      assert(launchDialog.open, "Escape and backdrop activation cannot dismiss the launch choice");
      const initialEquation = launchDoc.querySelector("#equationA").textContent + "+" + launchDoc.querySelector("#equationB").textContent;
      launchDoc.querySelector("#launchStartButton").click();
      await waitFor(() => !launchDialog.open && profileCookie() && profileCookie().launchChoiceMade, "persisted Start choice");
      assert(launchDoc.querySelector("#equationA").textContent + "+" + launchDoc.querySelector("#equationB").textContent === initialEquation,
        "Start keeps the already-generated level-based problem");
      let gameStartEvents = analyticsEntries(frame, "event", "game_start");
      assert(gameStartEvents.length === 1 && gameStartEvents[0][2].game_version === "2.0.0+62d794c",
        "the launch Start choice emits one versioned gameplay start event");
      launchDoc.querySelector(".unit.eligible").click();
      assert(analyticsEntries(frame, "event", "game_start").length === 1,
        "manual interaction after Start does not duplicate the gameplay start event");

      frame = await openGame("?launchReload=1&harness=1");
      assert(!frame.contentDocument.querySelector("#launchDialog").open,
        "a persisted launch choice prevents the dialog on reload");
      assert(analyticsEntries(frame, "event", "game_start").length === 0,
        "a returning-player reload waits for genuine engagement before tracking a start");
      frame.contentDocument.querySelector(".unit.eligible").click();
      assert(analyticsEntries(frame, "event", "game_start").length === 1,
        "a returning player's first accepted block emits the gameplay start event");
      const legacyV3Profile = {
        schemaVersion: 3, score: 0, emojiProgress: 0, sound: true, difficultyMode: "standard",
        currentLevel: 1, currentLevelSuccesses: 0, higherLevelSuccesses: 0, updatedAt: Date.now() + 5000
      };
      document.cookie = "numberGardenProgress=" + encodeURIComponent(JSON.stringify(legacyV3Profile)) + "; Path=/; SameSite=Lax";
      frame = await openGame("?legacyProfileReload=1&harness=1");
      assert(!frame.contentDocument.querySelector("#launchDialog").open && profileCookie().schemaVersion === 4 && profileCookie().launchChoiceMade,
        "an established v3 profile migrates without showing the new launch dialog");
      const api = frame.contentWindow.NumberGarden;

      assert(api.LEVEL_DEFINITIONS.length === 13, "all thirteen level definitions are exposed");
      assert(api.constants.PROFILE_SCHEMA_VERSION === 4, "profile schema v4 is exposed");
      assert(api.constants.GAME_VERSION === "2.0.0+62d794c" &&
        frame.contentDocument.querySelector("[data-version]").textContent === api.constants.GAME_VERSION,
        "analytics and the About view share the exposed game version");
      assert(Object.isFrozen(api.DIFFICULTY_MODES) && JSON.stringify(api.DIFFICULTY_MODES) === JSON.stringify(["standard", "easy"]),
        "the two supported difficulty modes are frozen and exposed");
      assert(Object.isFrozen(api.IDLE_HINT_TIMINGS) && Object.isFrozen(api.IDLE_HINT_TIMINGS.standard) &&
        Object.isFrozen(api.IDLE_HINT_TIMINGS.easy) && api.IDLE_HINT_TIMINGS.easy.NEXT_BLOCK === 3000 &&
        api.IDLE_HINT_TIMINGS.easy.FIRST_SOLVER_HINT === 20000 && api.IDLE_HINT_TIMINGS.easy.SOLVER_REPEAT === 5000 &&
        api.IDLE_HINT_TIMINGS.standard.NEXT_BLOCK === 9000 && api.IDLE_HINT_TIMINGS.standard.FIRST_SOLVER_HINT === 60000 &&
        api.IDLE_HINT_TIMINGS.standard.SOLVER_REPEAT === 15000,
        "the frozen Easy and Standard idle-hint timing table is exposed");
      assert(["NEXT_BLOCK", "FIRST_SOLVER_HINT", "SOLVER_REPEAT"].every(key =>
        api.IDLE_HINT_TIMINGS.standard[key] === api.IDLE_HINT_TIMINGS.easy[key] * 3),
        "every Standard idle wait is exactly three times its Easy wait");
      assert(api.defaultProfile().difficultyMode === "standard" && api.motionDiagnostics.snapshot().difficultyMode === "standard" &&
        frame.contentDocument.querySelector("#difficultyStandard").checked,
        "new profiles and the Settings control default to Standard");
      assert(Object.isFrozen(api.MOTION_TIMINGS) && api.MOTION_TIMINGS.BLOCK_FALL_LAND === 520 &&
        api.MOTION_TIMINGS.QUICK_DROP_STAGGER === 50 && api.MOTION_TIMINGS.QUICK_IMPACT === 320 &&
        api.MOTION_TIMINGS.CARRY_FORMATION === 300 && api.MOTION_TIMINGS.CARRY_TRAVEL === 560 &&
        api.MOTION_TIMINGS.CARRY_LANDING === 140 && api.MOTION_TIMINGS.BEETLE_REACTION === 360 &&
        api.MOTION_TIMINGS.DICE_TUMBLE === 380 && api.MOTION_TIMINGS.DICE_CARD_POP === 150 &&
        api.MOTION_TIMINGS.DICE_CARD_STAGGER === 35 && api.MOTION_TIMINGS.DICE_REDUCED_HIGHLIGHT === 140 &&
        api.MOTION_TIMINGS.TUTORIAL_STAGE_PAUSE === 1000 && api.MOTION_TIMINGS.TUTORIAL_ANSWER_PAUSE === 2000 &&
        api.MOTION_TIMINGS.SOLVER_GAP === 70,
        "production teaching-motion timings, including the two-second Tutorial answer pause, are frozen and exposed");
      assert(Object.isFrozen(api.ACTIVE_MOTION_TIMINGS) && api.ACTIVE_MOTION_TIMINGS.BLOCK_FALL_LAND < api.MOTION_TIMINGS.BLOCK_FALL_LAND,
        "harness mode compresses durations without skipping the lifecycle");
      assert(api.constants.QUICK_PLAY_HOLD_DURATION === 3000 && api.constants.DEFAULT_QUICK_PLAY_SPEED === 2 &&
        api.motionDiagnostics.snapshot().quickPlaySpeed === 2 &&
        api.motionDiagnostics.snapshot().productionQuickPlayHoldDuration === 1500 &&
        api.motionDiagnostics.snapshot().quickPlayHoldDuration === 60,
        "quick play defaults to a tunable 2x speed and a 1.5-second production hold");
      assert(analyticsEntries(frame, "event", "game_start").length === 0,
        "an established player does not start analytics merely by loading the game");
      frame.contentDocument.querySelector("#answerButton").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      await waitFor(() => frame.contentDocument.querySelector("#keypadDialog").open, "analytics fallback keypad open");
      frame.contentDocument.querySelector('[data-key="0"]').click();
      frame.contentDocument.querySelector("#checkAnswer").click();
      gameStartEvents = analyticsEntries(frame, "event", "game_start");
      assert(gameStartEvents.length === 1 && gameStartEvents[0][2].game_version === api.constants.GAME_VERSION &&
        analyticsEntries(frame, "event", "game_complete").length === 0,
        "the first non-empty answer submission starts engagement while a wrong answer does not complete it");
      frame.contentDocument.querySelector("#cancelKeypad").click();
      await waitFor(() => !frame.contentDocument.querySelector("#keypadDialog").open, "analytics fallback keypad close");
      const diceDoc = frame.contentDocument;
      const diceMotion = api.motionDiagnostics;
      diceMotion.clearEvents();
      const stableCurrentCard = diceDoc.querySelector(".suggestion.current");
      const stableCurrentMarkup = stableCurrentCard.innerHTML;
      const rollingDice = diceDoc.querySelector(".dice");
      const diceSoundBaseline = diceMotion.snapshot().soundEffectCount;
      rollingDice.focus();
      rollingDice.click();
      rollingDice.click();
      let diceSnapshot = diceMotion.snapshot();
      assert(diceSnapshot.diceRefreshState === "tumbling" && diceSnapshot.controlsLocked &&
        diceDoc.querySelector("#suggestionTray").getAttribute("aria-busy") === "true" &&
        rollingDice.classList.contains("rolling") && rollingDice.getAttribute("aria-disabled") === "true" &&
        rollingDice.getAttribute("aria-label").includes("Rolling the die"),
        "dice refresh enters a busy rolling state with an accessible in-progress label");
      assert(diceDoc.querySelector("#resetCurrent").disabled && diceDoc.querySelector("#answerButton").disabled &&
        diceDoc.querySelector("#settingsButton").disabled && diceDoc.querySelector("#nextButton").disabled &&
        diceDoc.querySelector(".unit.eligible").disabled &&
        Array.from(diceDoc.querySelectorAll(".suggestion:not(.current)")).every(button => button.disabled),
        "dice refresh locks counting and every competing problem control");
      const diceLockedResetStyle = frame.contentWindow.getComputedStyle(diceDoc.querySelector("#resetCurrent"));
      assert(diceLockedResetStyle.visibility === "visible" && diceLockedResetStyle.display !== "none" &&
        diceLockedResetStyle.opacity === "0.55",
        "dice refresh keeps the disabled reset control visibly mounted");
      assert(diceDoc.querySelector(".suggestion.current") === stableCurrentCard && stableCurrentCard.innerHTML === stableCurrentMarkup,
        "the current-problem card stays mounted and unchanged while the die tumbles");
      await waitFor(() => diceMotion.snapshot().diceRefreshState === "emphasizing", "staggered dice alternatives");
      const poppingAlternatives = Array.from(diceDoc.querySelectorAll(".suggestion:not(.current)"));
      assert(poppingAlternatives.length === 3 && poppingAlternatives.every(button =>
        button.classList.contains("refresh-pop") && button.dataset.refreshEmphasis === "pop" &&
        getComputedStyle(button).animationName === "suggestion-refresh-pop"),
        "all three refreshed alternatives receive the staggered pop and colored glow treatment");
      assert(diceDoc.querySelector(".suggestion.current") === stableCurrentCard &&
        !stableCurrentCard.classList.contains("refresh-pop") && !stableCurrentCard.dataset.refreshEmphasis,
        "the current card receives no refreshed-card emphasis");
      await waitFor(() => diceMotion.snapshot().diceRefreshState === "idle", "dice refresh completion");
      diceSnapshot = diceMotion.snapshot();
      const diceEvents = diceMotion.events();
      assert(diceSnapshot.diceRefreshCount === 1 &&
        diceEvents.filter(event => event.type === "dice-refresh-start").length === 1 &&
        diceEvents.some(event => event.type === "dice-tumble-start") &&
        diceEvents.some(event => event.type === "dice-landed") &&
        diceEvents.filter(event => event.type === "dice-card-emphasis").length === 3 &&
        diceEvents.some(event => event.type === "dice-refresh-complete"),
        "rapid repeat activation is ignored and the complete dice-refresh lifecycle is diagnosed");
      assert(diceDoc.activeElement === rollingDice && !diceDoc.querySelector("#suggestionTray").hasAttribute("aria-busy") &&
        !rollingDice.hasAttribute("aria-disabled") && rollingDice.getAttribute("aria-label") === "Refresh the three alternative problems" &&
        !diceSnapshot.controlsLocked && !diceDoc.querySelector("#settingsButton").disabled && !diceDoc.querySelector(".unit.eligible").disabled,
        "completion restores dice focus, accessible labels, and competing controls");
      assert(diceSnapshot.soundEffectCount > diceSoundBaseline,
        "a sound-on dice roll produces the synthesized rattle and landing effect");

      diceDoc.querySelector("#settingsButton").click();
      diceDoc.querySelector("#settingsSoundButton").click();
      diceDoc.querySelector("#closeSettings").click();
      const silentDiceMotion = frame.contentWindow.NumberGarden.motionDiagnostics;
      const silentDiceBaseline = silentDiceMotion.snapshot().soundEffectCount;
      diceDoc.querySelector(".dice").click();
      await waitFor(() => silentDiceMotion.snapshot().diceRefreshState === "idle", "silent dice refresh");
      assert(silentDiceMotion.snapshot().soundEffectCount === silentDiceBaseline,
        "a sound-off dice roll remains silent");
      diceDoc.querySelector("#settingsButton").click();
      diceDoc.querySelector("#settingsSoundButton").click();
      diceDoc.querySelector("#closeSettings").click();
      assert(api.nextQueueBoundary(0, 18, true, false) === 10 && api.nextQueueBoundary(10, 18, true, true) === 18 &&
        api.canQueuePlaceUnit(9, 0, 18, true, false) && !api.canQueuePlaceUnit(10, 0, 18, true, false),
        "queue-boundary helpers close at an unfinished trade and reopen afterward");
      const promptKeys = [
        "counting-ones", "counting-tens", "counting-tens-with-carry", "skip-zero-ones", "carrying-ones",
        "carrying-hundreds", "awaiting-answer", "completed", "place-value-fallback",
        "subtraction-minuend-ones", "subtraction-minuend-tens", "subtraction-subtrahend-ones",
        "subtraction-borrowing", "subtraction-subtrahend-tens", "subtraction-awaiting-answer", "subtraction-completed"
      ];
      assert(JSON.stringify(Object.keys(api.PROMPT_POOLS).sort()) === JSON.stringify(promptKeys.slice().sort()),
        "all addition and subtraction beetle prompt pools are exposed");
      promptKeys.forEach(key => {
        const pool = api.PROMPT_POOLS[key];
        assert(Object.isFrozen(pool) && pool.length >= 4, key + " has frozen prompt variants");
        assert(new Set(pool).size === pool.length && pool.every(message => typeof message === "string" && message.trim() === message && message.length > 0),
          key + " contains unique non-empty prompt text");
        assert(pool.every(message => message.length <= 90), key + " prompts stay compact for the mobile layout");
        assert(pool.every(message => Array.from(message.matchAll(/\{([^}]+)\}/g), match => match[1]).every(token => ["a", "b", "result"].includes(token))),
          key + " uses only supported prompt placeholders");
      });
      assert(Object.isFrozen(api.PROMPT_POOLS), "the beetle prompt pool collection is frozen");
      assert(["completed", "subtraction-completed"].every(key => api.PROMPT_POOLS[key].every(message =>
        message.includes("{a}") && message.includes("{b}") && message.includes("{result}"))),
        "every operation-specific completion prompt includes the full equation");
      assert(promptKeys.filter(key => !["completed", "subtraction-completed"].includes(key)).every(key =>
        api.PROMPT_POOLS[key].every(message => !message.includes("{"))),
        "only completion prompts contain dynamic placeholders");
      assert(api.selectPromptTemplate(["first", "second"], "first", sequence(0)) === "second",
        "prompt selection avoids the immediately previous template");
      assert(api.selectPromptTemplate(["only"], "only", sequence(.8)) === "only",
        "single-entry prompt selection remains safe");
      assert(api.formatPrompt("Nice! {a} + {b} = {result}.", { a: 68, b: 56, result: 124 }) === "Nice! 68 + 56 = 124.",
        "prompt formatting substitutes equation values");
      const stateKeys = [
        [{ phase: "completed" }, "completed"],
        [{ phase: "awaiting-answer" }, "awaiting-answer"],
        [{ phase: "carrying-to-tens", animationState: null }, "carrying-ones"],
        [{ phase: "counting-ones", animationState: "ones" }, "carrying-ones"],
        [{ phase: "carrying-to-hundreds", animationState: null }, "carrying-hundreds"],
        [{ phase: "counting-tens", animationState: "hundreds" }, "carrying-hundreds"],
        [{ phase: "counting-hundreds" }, "carrying-hundreds"],
        [{ phase: "counting-tens", skipMessage: true, tensCursor: 0 }, "skip-zero-ones"],
        [{ phase: "counting-ones" }, "counting-ones"],
        [{ phase: "counting-tens", visibleOnesCarry: true }, "counting-tens-with-carry"],
        [{ phase: "counting-tens", visibleOnesCarry: false }, "counting-tens"],
        [{ phase: "unknown" }, "place-value-fallback"]
      ];
      assert(stateKeys.every(([candidate, expected]) => api.promptKeyForState(candidate) === expected),
        "game states map to the correct beetle prompt pools");
      assert(api.deriveProblem(1, 99).result === 100, "deriveProblem accepts a single-digit boundary");
      assert(api.deriveProblem(99, 99).result === 198, "deriveProblem supports the maximum result");
      let rangeRejected = false;
      try { api.deriveProblem(0, 10); } catch (error) { rangeRejected = error.name === "RangeError"; }
      assert(rangeRejected, "deriveProblem rejects operands outside 1–99");

      const examples = [
        [1, 4, 5], [2, 9, 10], [3, 1, 9], [4, 8, 82], [5, 10, 10],
        [6, 49, 49], [7, 50, 50], [8, 50, 50], [9, 99, 99]
      ];
      examples.forEach(([level, a, b]) => {
        assert(api.problemMatchesLevel(api.deriveProblem(a, b), level), "representative operands match L" + level);
      });
      assert(!api.problemMatchesLevel(api.deriveProblem(9, 91), 4), "L4 excludes a three-digit result");
      assert(api.problemMatchesLevel(api.deriveProblem(50, 50), 8, "tens-only"), "L8 tags its tens-only pattern");
      assert(api.problemMatchesLevel(api.deriveProblem(55, 55), 8, "both-carries"), "L8 tags its both-carries pattern");

      for (let level = 1; level <= 13; level += 1) {
        let allValid = true;
        for (let index = 0; index < 40; index += 1) {
          const model = api.generateProblemForLevel(level);
          allValid &&= model.curriculumLevel === level && api.problemMatchesLevel(model, level, model.curriculumPattern);
        }
        assert(allValid, "40 generated L" + level + " problems are valid and tagged");
      }
      const l8Tens = api.generateProblemForLevel(8, new Set(), sequence(.499, 0, 0));
      const l8Both = api.generateProblemForLevel(8, new Set(), sequence(.5, 0, 0));
      assert(l8Tens.curriculumPattern === "tens-only", "L8 roll below 50% selects tens-only carry");
      assert(l8Both.curriculumPattern === "both-carries", "L8 roll at 50% selects both-column carries");

        analyticsEntries(frame, "event", "game_complete").length === 0,
        "a Settings Tutorial neither duplicates the start nor emits a completion event");
      assert(!reloadedDoc.querySelector("#toast").classList.contains("show") && reloadedDoc.querySelector("#toast").textContent === "",
        "Tutorial shows no reward toast");
      assert(reloadedDoc.querySelector("#nextButton").textContent === "Next →",
        "a Settings Tutorial returns to the ordinary Next flow");

      reloadedDoc.querySelector("#nextButton").click();
      const answer = Number(reloadedDoc.querySelector("#equationA").textContent) + Number(reloadedDoc.querySelector("#equationB").textContent);
      await enterAnswer(frame, answer, true);
      assert(reloadedDoc.querySelector("#scoreValue").textContent === "10" && profileCookie().score === 10 && profileCookie().emojiProgress === 1,
        "manual completion after a wrong attempt awards exactly one reward");
      const gameCompleteEvents = analyticsEntries(frame, "event", "game_complete");
      assert(analyticsEntries(frame, "event", "game_start").length === 1 && gameCompleteEvents.length === 1 &&
        gameCompleteEvents[0][2].score === 10 && gameCompleteEvents[0][2].questions_answered === 1 &&
        gameCompleteEvents[0][2].game_version === api.constants.GAME_VERSION,
        "manual success emits one completion with updated cumulative score, answer count, and version");

      frame = await openGame("?op=subtraction&a=42&b=12&harness=1");
      let subtractionDoc = frame.contentDocument;
      let subtractionApi = frame.contentWindow.NumberGarden;
      await finishSubtractionCounting(frame);
      let subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      assert(subtractionSnapshot.phase === "awaiting-answer" && subtractionSnapshot.borrowCount === 0 &&
        subtractionSnapshot.resultTens === 3 && subtractionSnapshot.resultOnes === 0,
        "42−12 follows the two-digit subtraction path without borrowing");
      assert(subtractionDoc.querySelector(".result-panel .digit-label"),
        "Easy exposes the running subtraction difference labels");
      subtractionDoc.querySelector("#settingsButton").click();
      subtractionDoc.querySelector("#difficultyStandard").click();
      subtractionDoc.querySelector("#closeSettings").click();
      assert(!subtractionDoc.querySelector(".result-panel .digit-label") &&
        subtractionApi.motionDiagnostics.snapshot().resultTens === 3,
        "Standard hides subtraction running labels without changing the settled difference");
      assert(subtractionDoc.body.classList.contains("operation-subtraction") &&
        subtractionDoc.querySelector("#equationOperator").textContent === "−" &&
        !subtractionDoc.querySelector(".column-title.hundreds") &&
        subtractionDoc.querySelector(".equation-card").getAttribute("aria-label").includes("42 minus 12") &&
        subtractionDoc.querySelector(".addend-badge.first").getAttribute("aria-label") === "Minuend 42" &&
        subtractionDoc.querySelector(".addend-badge.second").getAttribute("aria-label") === "Subtrahend 12" &&
        subtractionDoc.querySelector(".addend-badge.result").getAttribute("aria-label") === "Difference not yet revealed",
        "subtraction activates its purple theme, minus operator, hidden Hundreds, and semantic operand labels");

      frame = await openGame("?op=subtraction&a=42&b=17&harness=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      const eligibleCoral = frame.contentWindow.getComputedStyle(subtractionDoc.querySelector(".unit.eligible")).boxShadow;
      subtractionApi.motionDiagnostics.clearEvents();
      await finishSubtractionCounting(frame);
      subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      const borrowEvents = subtractionApi.motionDiagnostics.events().filter(event => event.type.startsWith("borrow-"));
      assert(subtractionSnapshot.borrowCount === 1 && subtractionSnapshot.resultTens === 2 && subtractionSnapshot.resultOnes === 5 &&
        JSON.stringify(borrowEvents.map(event => event.type)) === JSON.stringify(["borrow-formation", "borrow-travel", "borrow-landed"]),
        "42−17 automatically borrows after exact Ones depletion and resumes individual subtraction");
      assert(eligibleCoral.includes("225, 74, 79"),
        "the eligible pulse uses coral rather than the subtraction theme's purple");

      frame = await openGame("?op=subtraction&a=42&b=17&harness=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      subtractionDoc.querySelector(".unit.eligible").click();
      await waitFor(() => !subtractionApi.motionDiagnostics.snapshot().controlsLocked &&
        subtractionApi.motionDiagnostics.snapshot().resultOnes === 1, "partial subtraction before reset");
      subtractionDoc.querySelector("#resetCurrent").click();
      subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      assert(subtractionSnapshot.phase === "counting-minuend-ones" && subtractionSnapshot.resultOnes === 0 &&
        subtractionSnapshot.resultTens === 0 && subtractionSnapshot.minuendOnesLandedCursor === 0 &&
        subtractionSnapshot.subtrahendOnesLandedCursor === 0,
        "reset during partial subtraction restores every source and difference cursor");

      frame = await openGame("?op=subtraction&a=42&b=17&harness=1");
      subtractionApi = frame.contentWindow.NumberGarden;
      subtractionApi.motionDiagnostics.clearEvents();
      const quickActions = await finishSubtractionCounting(frame, true);
      const quickSubtractionEvents = subtractionApi.motionDiagnostics.events();
      subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      assert(quickActions === 4 && subtractionSnapshot.borrowCount === 1 && subtractionSnapshot.resultTens === 2 &&
        subtractionSnapshot.resultOnes === 5 &&
        JSON.stringify(quickSubtractionEvents.filter(event => event.type === "quick-drop-accepted").map(event => event.count)) ===
          JSON.stringify([2, 4, 7, 1]) && quickSubtractionEvents.some(event => event.type === "borrow-landed"),
        "one quick-drop hold accepts the whole subtrahend Ones cell, crosses borrowing, and resumes automatically");

      frame = await openGame("?op=subtraction&a=40&b=7&harness=1");
      subtractionApi = frame.contentWindow.NumberGarden;
      assert(subtractionApi.motionDiagnostics.snapshot().phase === "counting-minuend-tens",
        "40−7 skips the empty minuend Ones phase");
      await finishSubtractionCounting(frame);
      subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      assert(subtractionSnapshot.borrowCount === 1 && subtractionSnapshot.resultTens === 3 && subtractionSnapshot.resultOnes === 3,
        "40−7 borrows before the first subtrahend One and produces 33");

      frame = await openGame("?op=subtraction&a=8&b=8&harness=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      const zeroScoreBefore = Number(subtractionDoc.querySelector("#scoreValue").textContent);
      await finishSubtractionCounting(frame);
      subtractionDoc.querySelector("#answerButton").click();
      await waitFor(() => subtractionDoc.querySelector("#keypadDialog").open, "zero-difference keypad semantics");
      assert(subtractionDoc.querySelector("#keypadEquation").textContent === "8 − 8 =",
        "the subtraction keypad renders the correct operator and operands");
      subtractionDoc.querySelector("#cancelKeypad").click();
      await enterAnswer(frame, 0, true);
      assert(subtractionApi.motionDiagnostics.snapshot().phase === "completed" &&
        subtractionDoc.querySelector("#answerButton").textContent === "0" &&
        subtractionDoc.querySelector(".addend-badge.result").getAttribute("aria-label") === "Difference 0" &&
        subtractionDoc.querySelector("#promptText").textContent.includes("8 − 8 = 0") &&
        Number(subtractionDoc.querySelector("#scoreValue").textContent) === zeroScoreBefore + 10,
        "single-digit zero difference accepts typed zero, recovers from a wrong answer, and awards one manual reward");
      const subtractionComplete = analyticsEntries(frame, "event", "game_complete");
      assert(subtractionComplete.length === 1 && subtractionComplete[0][2].operation === "subtraction" &&
        subtractionComplete[0][2].operand_a === 8 && subtractionComplete[0][2].operand_b === 8 && subtractionComplete[0][2].result === 0,
        "subtraction completion analytics carry operation-correct operands and result");

      frame = await openGame("?op=subtraction&a=20&b=19&harness=1&reducedMotion=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      const tutorialScoreBefore = subtractionDoc.querySelector("#scoreValue").textContent;
      subtractionDoc.querySelector("#settingsButton").click();
      subtractionDoc.querySelector("#runSolverButton").click();
      await waitFor(() => subtractionApi.motionDiagnostics.snapshot().phase === "completed" &&
        !subtractionApi.motionDiagnostics.snapshot().solverRunning, "reduced-motion borrowing Tutorial", 20000);
      subtractionSnapshot = subtractionApi.motionDiagnostics.snapshot();
      assert(subtractionSnapshot.reducedMotion && subtractionSnapshot.borrowCount === 1 &&
        subtractionSnapshot.resultTens === 0 && subtractionSnapshot.resultOnes === 1 &&
        subtractionDoc.querySelector("#scoreValue").textContent === tutorialScoreBefore &&
        analyticsEntries(frame, "event", "game_complete").length === 0,
        "reduced-motion Tutorial solves 20−19 with borrowing and grants no reward or analytics completion");

      frame = await openGame("?op=subtraction&a=42&b=12&harness=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      const noBorrowTutorialScore = subtractionDoc.querySelector("#scoreValue").textContent;
      subtractionDoc.querySelector("#settingsButton").click();
      subtractionDoc.querySelector("#runSolverButton").click();
      await waitFor(() => subtractionApi.motionDiagnostics.snapshot().phase === "completed" &&
        !subtractionApi.motionDiagnostics.snapshot().solverRunning, "non-borrowing subtraction Tutorial", 20000);
      assert(subtractionApi.motionDiagnostics.snapshot().borrowCount === 0 &&
        subtractionApi.motionDiagnostics.snapshot().resultTens === 3 && subtractionApi.motionDiagnostics.snapshot().resultOnes === 0 &&
        subtractionDoc.querySelector("#scoreValue").textContent === noBorrowTutorialScore,
        "Tutorial also completes subtraction without borrowing and awards no reward");

      const levelThirteenProfile = { ...profileCookie(), currentLevel: 13, currentLevelSuccesses: 0, higherLevelSuccesses: 0,
        updatedAt: Date.now() + 1000000 };
      document.cookie = "numberGardenProgress=" + encodeURIComponent(JSON.stringify(levelThirteenProfile)) + "; Path=/; SameSite=Lax";
      frame = await openGame("?op=subtraction&a=42&b=17&harness=1");
      subtractionDoc = frame.contentDocument;
      subtractionApi = frame.contentWindow.NumberGarden;
      assert(subtractionDoc.querySelector("#levelBadge").textContent === "L13" &&
        subtractionDoc.querySelectorAll("#levelSelect option").length === 13 && !subtractionDoc.querySelector(".column-title.hundreds"),
        "Settings exposes L1–L13 and subtraction hides Hundreds even at L13");
      let mixedOperators = false;
      for (let attempt = 0; attempt < 8 && !mixedOperators; attempt += 1) {
        const cards = Array.from(subtractionDoc.querySelectorAll(".suggestion"), card => card.textContent);
        mixedOperators = cards.some(text => text.includes("+")) && cards.some(text => text.includes("−"));
        if (!mixedOperators) {
          subtractionDoc.querySelector(".dice").click();
          await waitFor(() => subtractionApi.motionDiagnostics.snapshot().diceRefreshState === "idle", "L13 mixed refresh");
        }
      }
      assert(mixedOperators, "L13 suggestions render a mixed set of operation-correct symbols");

      frame = await openGame("?a=42&b=17&harness=1");
      const revertedDoc = frame.contentDocument;
      assert(revertedDoc.body.classList.contains("operation-addition") && !revertedDoc.body.classList.contains("operation-subtraction") &&
        revertedDoc.querySelector("#equationOperator").textContent === "+" && revertedDoc.querySelector(".column-title.hundreds"),
        "a subsequent addition reverts the blue/green theme and restores the unlocked Hundreds column");

      document.body.dataset.status = "passed";
      document.title = "PASS: Number Garden curriculum checks";
      results.textContent = checks.join("\n") + "\n\n" + checks.length + " checks passed.";
    }

    run().catch(error => {
      document.body.dataset.status = "failed";
      document.title = "FAIL: Number Garden curriculum checks";
      const currentFrame = document.querySelector("iframe");
      const motionApi = currentFrame && currentFrame.contentWindow.NumberGarden && currentFrame.contentWindow.NumberGarden.motionDiagnostics;
      const diagnostic = motionApi ? "\n\nMOTION: " + JSON.stringify(motionApi.snapshot()) +
        "\nEVENTS: " + JSON.stringify(motionApi.events()) : "";
      results.textContent = checks.join("\n") + "\n\nFAIL: " + (error.stack || error.message) + diagnostic;
    });
  </script>
</body>
</html>
